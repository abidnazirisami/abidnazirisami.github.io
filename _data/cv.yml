# Content of the homepage sections Experience, Education, Awards and
# Volunteering. _includes/timeline.html renders each list.
#
# Full entries (experience, education):
#   date     shown in the left column
#   org      name of the organization; org_url makes it a link
#   role     position or degree; place is appended after it
#   meta     short labelled lines, e.g. Advisor, Project
#   detail   one or two sentences
#   list     short unlabelled lines, e.g. the courses of a teaching post
#   links    buttons under the entry
#
# Compact entries (awards, activities):
#   date, name (url makes it a link), note
#
# meta text, detail, list items and note accept inline Markdown.

