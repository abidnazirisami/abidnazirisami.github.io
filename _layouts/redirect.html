{%- comment -%}
  A page that only forwards to another address. Front matter:
    redirect_to: /#publications
{%- endcomment -%}
{%- assign target = page.redirect_to | relative_url -%}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ site.title | escape }}</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
  <meta http-equiv="refresh" content="0; url={{ target }}">
  <script>window.location.replace({{ target | jsonify }});</script>
</head>
<body>
  <p>This page moved to <a href="{{ target }}">{{ target }}</a>.</p>
</body>
</html>
